name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Cho phép build thủ công

jobs:
  build-ios:
    name: Build iOS IPA (Unsigned)
    runs-on: macos-14 # Sử dụng runner macOS 14 của GitHub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm ci || npm install --legacy-peer-deps

      - name: Build web assets
        run: npm run build # Lệnh này tạo ra thư mục dist/ hoặc build/

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      - name: Install CocoaPods dependencies
        run: |
          cd ios/App
          pod install --repo-update

      - name: Disable code signing in Xcode project
        run: |
          # Sửa trực tiếp file project.pbxproj để tắt code signing
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "";/g' ios/App/App.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = "";/g' ios/App/App.xcodeproj/project.pbxproj

      - name: Archive iOS app without signing
        run: |
          xcodebuild archive \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -archivePath ${{ runner.temp }}/unsigned.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS'

      - name: Package unsigned IPA
        run: |
          # Tạo cấu trúc thư mục Payload chuẩn của IPA
          mkdir -p ${{ runner.temp }}/Payload
          # Sao chép file .app từ archive vào Payload
          cp -R ${{ runner.temp }}/unsigned.xcarchive/Products/Applications/App.app ${{ runner.temp }}/Payload/
          # Nén thành file .ipa
          cd ${{ runner.temp }}
          zip -r -q App-unsigned.ipa Payload/

      - name: Upload unsigned IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-unsigned
          path: ${{ runner.temp }}/App-unsigned.ipa
          retention-days: 30