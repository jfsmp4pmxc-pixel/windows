name: Build Unsigned iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS IPA (Unsigned)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Create Capacitor wrapper project
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p cap-app
          cd cap-app

          npm init -y
          # Pin Capacitor 6 (dùng CocoaPods, ổn định)
          npm install @capacitor/core@^6 @capacitor/ios@^6 @capacitor/cli@^6

          mkdir -p www
          shopt -s dotglob nullglob
          for f in ${{ github.workspace }}/*; do
            base=$(basename "$f")
            if [ "$base" != ".git" ] && [ "$base" != ".github" ] && [ "$base" != "node_modules" ]; then
              cp -R "$f" www/
            fi
          done
          shopt -u dotglob nullglob

          if [ ! -f www/index.html ]; then
            if [ -f www/App.html ]; then
              echo "→ Tạo index.html từ App.html"
              cp www/App.html www/index.html
            else
              echo "❌ Không tìm thấy index.html hoặc App.html"
              ls -la www/
              exit 1
            fi
          fi

          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.example.myapp",
            "appName": "MyApp",
            "webDir": "www"
          }
          EOF

          echo "=== Running: npx cap add ios ==="
          npx cap add ios

          echo "=== Running: npx cap sync ios ==="
          npx cap sync ios

          echo "=== DEBUG: ios/ structure ==="
          ls -la ios/ || true
          echo "--- ios/App/ ---"
          ls -la ios/App/ || true
          echo "--- Podfile check ---"
          if [ -f "ios/App/Podfile" ]; then
            echo "✅ Podfile tồn tại"
          else
            echo "⚠️ Podfile KHÔNG tồn tại"
          fi
          echo "--- SPM check (Package.swift) ---"
          find ios -name "Package.swift" 2>/dev/null || echo "Không có Package.swift"

      - name: Install CocoaPods dependencies
        working-directory: ${{ runner.temp }}/cap-app/ios/App
        run: |
          if [ -f "Podfile" ] && [ ! -d "Pods" ]; then
            echo "→ Running: pod install"
            pod install --repo-update
          else
            echo "✅ Bỏ qua pod install (không có Podfile hoặc Pods đã cài)"
          fi

      - name: Disable code signing
        working-directory: ${{ runner.temp }}/cap-app/ios/App
        run: |
          if [ ! -f "App.xcodeproj/project.pbxproj" ]; then
            echo "❌ Không tìm thấy App.xcodeproj/project.pbxproj"
            ls -la
            exit 1
          fi
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' App.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "";/g' App.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = "";/g' App.xcodeproj/project.pbxproj

      - name: Archive iOS app without signing
        run: |
          WORKSPACE="${{ runner.temp }}/cap-app/ios/App/App.xcworkspace"
          if [ ! -d "$WORKSPACE" ]; then
            echo "❌ Không có $WORKSPACE"
            ls -la ${{ runner.temp }}/cap-app/ios/App/
            exit 1
          fi
          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme App \
            -configuration Release \
            -archivePath ${{ runner.temp }}/unsigned.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS'

      - name: Package unsigned IPA
        run: |
          mkdir -p ${{ runner.temp }}/Payload
          cp -R ${{ runner.temp }}/unsigned.xcarchive/Products/Applications/App.app ${{ runner.temp }}/Payload/
          cd ${{ runner.temp }}
          zip -r -q App-unsigned.ipa Payload/
          ls -lh App-unsigned.ipa

      - name: Upload unsigned IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-unsigned
          path: ${{ runner.temp }}/App-unsigned.ipa
          retention-days: 30